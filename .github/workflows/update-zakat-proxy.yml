name: Update Zakat Proxy Data

on:
  schedule:
    # Run every Monday at 6:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run zakat proxy calculator
        run: python scripts/update_zakat_proxy.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/zakat-proxy.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update zakat proxy data ($(date +%Y-%m-%d))"
            git push
          fi
